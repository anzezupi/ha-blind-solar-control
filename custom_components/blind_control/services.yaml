resume:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: blind_control

pause:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: blind_control
    minutes:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: min
          mode: box

recalculate:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: blind_control
